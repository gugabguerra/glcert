# golangci-lint v2 configuration for the GLCert backend.
#
# The workflow runs it from the repository root:
#   golangci/golangci-lint-action@v8  (working-directory: backend)
version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - staticcheck
    - misspell
  settings:
    errcheck:
      # Pre-existing backlog on the current tree: ~170 unchecked error returns.
      # Entries are fully qualified (receiver types included, as errcheck
      # matches them), so trim this list as the call sites get fixed.
      exclude-functions:
        # Best-effort HTTP response writes and streamed downloads.
        - "io.Copy"
        - "fmt.Fprintf"
        - "(net/http.ResponseWriter).Write"
        # JSON payload encoding/decoding, including best-effort error responses.
        - "(*encoding/json.Encoder).Encode"
        - "(*encoding/json.Decoder).Decode"
        - "encoding/json.Unmarshal"
        # Statements and teardown steps whose failures are unrecoverable.
        - "(*database/sql.DB).Exec"
        - "(*database/sql.Tx).Exec"
        - "(*database/sql.Tx).Rollback"
        - "(*database/sql.Rows).Close"
        - "(*database/sql.Row).Scan"
        - "(*database/sql.DB).Close"
        - "(*os.File).Close"
        - "(io/fs.File).Close"
        - "(io.ReadCloser).Close"
        - "(mime/multipart.File).Close"
        - "(*archive/zip.Writer).Close"
        - "(*archive/tar.Writer).Close"
        - "(*compress/gzip.Writer).Close"
        - "os.Remove"
        - "os.RemoveAll"
        # Notification and audit side effects that only log their failures.
        - "(*github.com/gugabguerra/glcert/internal/services.AuthService).SaveResetToken"
        - "(*github.com/gugabguerra/glcert/internal/services.AuthService).UpdateUserName"
        - "(*github.com/gugabguerra/glcert/internal/services.EmailService).SendPasswordResetEmail"
        - "(*github.com/gugabguerra/glcert/internal/services.CAService).DeleteCA"
        - "(*github.com/gugabguerra/glcert/internal/services.CertService).DeleteCert"
        - "(*github.com/gugabguerra/glcert/internal/services.CertService).DeleteVersion"
    staticcheck:
      checks:
        - "all"
        # golangci-lint's built-in defaults, kept so the package-comment,
        # initialism and naming suggestions stay off.
        - "-ST1000"
        - "-ST1003"
        - "-ST1016"
        - "-ST1020"
        - "-ST1021"
        - "-ST1022"
        # Rewrite suggestions that conflict with the current handlers/services.
        - "-QF1003"
        - "-QF1008"
        - "-S1011"
  exclusions:
    rules:
      # Helpers that only the package's own tests reference.
      - linters: [unused]
        path: '_test\.go$'
      - linters: [unused]
        text: "validFileTypes is unused"

formatters:
  enable:
    - gofmt
    - goimports
